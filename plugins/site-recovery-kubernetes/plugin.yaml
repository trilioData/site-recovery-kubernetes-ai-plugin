# Portable plugin source. `pluginkit generate` turns this into the files
# Claude Code, Codex, Cursor and Junie each expect. Edit this, not those.
name: site-recovery-kubernetes
displayName: Trilio Site Recovery
version: 0.2.0
description: Helps coding agents set up and operate Trilio Site Recovery for Kubernetes.
descriptions:
  claude-code: Helps Claude Code set up and operate Trilio Site Recovery for Kubernetes, grounded in the official docs.
  junie: Helps Junie set up and operate Trilio Site Recovery for Kubernetes.
author:
  name: Trilio
homepage: https://github.com/trilioData/site-recovery-kubernetes-ai-plugin
repository: https://github.com/trilioData/site-recovery-kubernetes-ai-plugin
license: Apache-2.0
keywords: [trilio, site-recovery, kubernetes, disaster-recovery, failover]
category: Developer Tools

targets: [claude-code, codex, cursor, junie]

# The official TSR docs, generated from the TSR source. If this URL changes,
# see "Updating the docs URL" in the README.
mcpServers:
  trilio-site-recovery-docs:
    url: https://docs-tsr.trilio.io/api/mcp/mark-reid/trilio-site-recovery-for-kubernetes

codex:
  shortDescription: Set up and operate Trilio Site Recovery for Kubernetes
  longDescription: Guides setup, DR configuration, failover and failback with Trilio Site Recovery, using the official TSR docs and asking before any change to a cluster.
  capabilities: [Read, Write]
  websiteURL: https://trilio.io
  defaultPrompt:
    - Help me understand how to use Trilio Site Recovery for Kubernetes.
